[package]
name = "kyu-executor"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
description = "Vectorized query executor with Cranelift JIT for KyuGraph"
license = "MIT"
repository = "https://github.com/offbit-ai/kyugraph"

[dependencies]
kyu-common     = { workspace = true }
kyu-types      = { workspace = true }
kyu-parser     = { workspace = true }
kyu-catalog    = { workspace = true }
kyu-expression = { workspace = true }
kyu-binder     = { workspace = true }
kyu-planner    = { workspace = true }
kyu-storage    = { workspace = true }
smol_str       = { workspace = true }
hashbrown      = { workspace = true }
arc-swap       = { workspace = true }
dashmap        = { workspace = true }
rayon          = { workspace = true }
tracing        = { workspace = true }

# JIT (always included)
cranelift-jit      = { workspace = true }
cranelift-module   = { workspace = true }
cranelift-codegen  = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-native   = { workspace = true }

[features]
# Compatibility alias for callers that previously selected JIT explicitly.
# JIT dependencies and execution are unconditional, including no-default builds.
jit = []

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "jit_bench"
harness = false
