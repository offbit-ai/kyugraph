[package]
name = "kyu-graph"
version = "0.4.0"
edition = "2024"
description = "High-performance embedded property graph database with Cypher query support"
license = "MIT"
repository = "https://github.com/offbit-ai/kyugraph"
homepage = "https://github.com/offbit-ai/kyugraph"
keywords = ["graph", "database", "cypher", "embedded", "property-graph"]
categories = ["database", "data-structures"]
readme = "README.md"
rust-version = "1.96"

[dependencies]
kyu-api       = { workspace = true }
kyu-binder    = { workspace = true }
kyu-common    = { workspace = true }
kyu-copy      = { workspace = true, optional = true }
kyu-delta     = { workspace = true }
kyu-executor  = { workspace = true }
kyu-extension = { workspace = true }
kyu-types     = { workspace = true }
serde_json    = { workspace = true }

[features]
default = ["jit", "imports", "flight", "s3"]
jit = ["kyu-api/jit", "kyu-executor/jit"]
imports = ["kyu-api/imports", "dep:kyu-copy"]
flight = ["kyu-api/flight"]
s3 = ["kyu-api/s3"]
