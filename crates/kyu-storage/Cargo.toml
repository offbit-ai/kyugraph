[package]
name = "kyu-storage"
version = "0.4.0"
edition = "2024"
description = "Columnar storage engine for KyuGraph with buffer management and S3 support"
license = "MIT"
repository = "https://github.com/offbit-ai/kyugraph"

[dependencies]
kyu-common  = { workspace = true }
kyu-types   = { workspace = true }
dashmap     = { workspace = true }
smol_str    = { workspace = true }
thiserror   = { workspace = true }
aws-sdk-s3  = { workspace = true, optional = true }
aws-config  = { workspace = true, optional = true }
tokio       = { workspace = true, optional = true }

[features]
default = ["s3"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:tokio"]
